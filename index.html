S("g1", 2, "Find each interior angle of a regular octagon (degrees).", ["135", "135°"], "(8 − 2) × 180 ÷ 8 = 135°.");
M("g2", 1, "Which quadrilateral has diagonals that bisect each other at right angles and four equal sides?", ["Rectangle", "Kite", "Rhombus", "Trapezium"], 2, "A rhombus has four equal sides and perpendicular bisecting diagonals.");
S("g2", 1, "An isosceles triangle has an apex angle of 40°. Find one base angle (degrees).", ["70", "70°"], "(180 − 40) ÷ 2 = 70°.");
W("g2", 2, "struct", 3, "A parallelogram has one angle of 65°. Find the other three angles, giving reasons.", "Opposite angle = 65° (opposite angles of a parallelogram are equal) [1]; adjacent angles = 115° [1] (co-interior angles sum to 180°) [1].");
S("g3", 1, "A right-angled triangle has shorter sides 6 cm and 8 cm. Find the hypotenuse (cm).", ["10", "10cm"], "√(36 + 64) = √100 = 10 cm.");
S("g3", 2, "The hypotenuse is 13 cm and one side is 5 cm. Find the other side (cm).", ["12", "12cm"], "√(169 − 25) = √144 = 12 cm.");
M("g3", 2, "Which set of sides forms a right-angled triangle?", ["4, 5, 6", "7, 24, 25", "6, 7, 9", "5, 11, 12"], 1, "7² + 24² = 49 + 576 = 625 = 25².");
W("g3", 3, "exam", 3, "A ladder 5 m long leans against a wall. Its foot is 1.4 m from the wall. How high up the wall does it reach? Give your answer to 3 s.f.", "h² = 5² − 1.4² [1] = 25 − 1.96 = 23.04 [1]; h = 4.8 m (4.80) [1].");
S("g4", 1, "Write the bearing of due West as a three-figure bearing.", ["270", "270°"], "Clockwise from north: N 000°, E 090°, S 180°, W 270°.");
S("g4", 2, "B is on a bearing of 070° from A. Find the bearing of A from B.", ["250", "250°"], "Back bearing: 070 + 180 = 250°.");
M("g4", 2, "The bearing of Q from P is 300°. The bearing of P from Q is…", ["060°", "120°", "240°", "480°"], 1, "300 − 180 = 120°.");
W("g4", 3, "exam", 3, "A ship sails 9 km due south and then 12 km due west. (a) How far is it from its start? [2] (b) Is the bearing of the ship from its start between 180° and 270°? Explain. [1]", "(a) √(81 + 144) [1] = 15 km [1]\n(b) Yes—it is south-west of the start, which lies between 180° and 270° [1].");
M("f1", 1, "Which mapping is NOT a function?", ["one-to-one", "many-to-one", "one-to-many", "all of these are functions"], 2, "In a one-to-many mapping an input has more than one output.");
M("f1", 1, "f: x ↦ 2x + 1 maps {1, 2, 3} to…", ["{2, 4, 6}", "{3, 5, 7}", "{3, 4, 5}", "{1, 3, 5}"], 1, "2(1)+1 = 3, 2(2)+1 = 5, 2(3)+1 = 7.");
W("f1", 2, "struct", 2, "A relation maps 4 → 2 and 4 → −2. Is it a function? Explain.", "No [1]; the input 4 has two different outputs [1].");
M("f2", 1, "f(x) = x² with domain {−2, −1, 0, 1, 2}. The range is…", ["{−4, −1, 0, 1, 4}", "{0, 1, 4}", "{0, 1, 2, 4}", "{−2, 2}"], 1, "Squares: 4, 1, 0, 1, 4 → {0, 1, 4}.");
M("f2", 2, "Which value must be excluded from the domain of g(x) = 1/(x − 4)?", ["0", "1", "4", "−4"], 2, "x = 4 makes the denominator 0.");
S("f2", 2, "f(x) = 3x − 1 with domain {0, 1, 2}. What is the largest value in the range?", ["5"], "f(2) = 3(2) − 1 = 5.");
M("f3", 1, "Which graph fails the vertical line test?", ["y = 2x + 1", "y = x²", "x² + y² = 25", "y = x³"], 2, "A vertical line through a circle meets it twice.");
M("f3", 1, "The vertical line test checks whether a graph…", ["is one-to-one", "is a function", "is linear", "passes through the origin"], 1, "A function has at most one y for each x.");
W("f3", 2, "struct", 2, "Explain why the graph of x = y² is not a function.", "For x = 4, y = 2 and y = −2 [1]; a vertical line meets the graph twice, so one input has two outputs [1].");
M("f4", 1, "f(x) = x² is an example of a … function.", ["one-to-one", "many-to-one", "one-to-many", "constant"], 1, "f(2) = f(−2) = 4, so two inputs share an output.");
M("f4", 2, "Which function is linear?", ["f(x) = x² + 1", "f(x) = 1/x", "f(x) = 4x − 7", "f(x) = x³"], 2, "Linear functions have the form mx + c.");
M("f4", 2, "A function where at least one codomain element is never an output is called…", ["onto", "into", "one-to-one", "constant"], 1, "Into functions do not cover the whole codomain.");
S("f5", 1, "f(x) = 3x − 4. Find f(2).", ["2"], "3(2) − 4 = 2.");
S("f5", 2, "h(x) = 2x + 5. Solve h(x) = −1.", ["-3", "x=-3"], "2x + 5 = −1 → 2x = −6 → x = −3.");
S("f5", 2, "g(x) = x² − 3. Find g(−4).", ["13"], "(−4)² − 3 = 16 − 3 = 13.");
M("f5", 3, "f(x) = 3x − 4. f(a + 1) = ?", ["3a − 3", "3a − 1", "3a + 1", "3a − 4"], 1, "3(a + 1) − 4 = 3a + 3 − 4 = 3a − 1.");
S("f6", 2, "f(x) = 2x + 3 and g(x) = x². Find gf(1).", ["25"], "f(1) = 5, then g(5) = 25.");
S("f6", 2, "f(x) = x − 4 and g(x) = 3x. Find fg(2).", ["2"], "g(2) = 6, then f(6) = 2.");
M("f6", 2, "f(x) = x + 1, g(x) = x². fg(x) = ?", ["(x + 1)²", "x² + 1", "x² + 2x + 1", "2x + 1"], 1, "fg(x) = f(g(x)) = f(x²) = x² + 1.");
W("f6", 3, "exam", 4, "f(x) = 2x + 3 and g(x) = x².\n(a) Find gf(x). [1]\n(b) Find fg(x). [1]\n(c) Solve gf(x) = fg(x). [2]", "(a) (2x + 3)² [1]\n(b) 2x² + 3 [1]\n(c) 4x² + 12x + 9 = 2x² + 3 → 2x² + 12x + 6 = 0 → x² + 6x + 3 = 0 [1]; x = −3 ± √6 [1].");

/* ---------- ENGLISH ---------- */
M("e1", 1, "Information that is stated directly in a text is…", ["implicit", "explicit", "inferred", "biased"], 1, "Explicit information is stated openly.");
M("e1", 2, "'Every single day, tonnes of plastic choke our oceans.' The main technique is…", ["statistics", "emotive language", "rhetorical question", "anecdote"], 1, "'Choke' is emotive, making the reader feel the harm.");
M("e1", 2, "Which is the best PEE 'Explain' sentence?", ["This is a quote.", "The writer uses words.", "The verb 'smothered' suggests the beach is suffocating under rubbish, alarming the reader.", "I like this sentence."], 2, "It explains the effect of a specific word on the reader.");
M("e1", 1, "Scanning a text means…", ["reading every word slowly", "looking quickly for specific details", "summarising the text", "reading only the title"], 1, "Scan for specific information; skim for the gist.");
W("e1", 3, "exam", 4, "Read: 'Our town's only library closes on Friday. For forty years it has welcomed children, students and pensioners. Is a little more money for the car park really worth losing all that?'\nHow does the writer try to persuade readers that the library should stay open? [4]", "1 mark each, up to 4: identifies rhetorical question and explains it challenges readers to agree; 'forty years' shows long history/value; list of users shows it serves the whole community; contrast between 'a little more money' and 'losing all that' makes closure seem unreasonable.");
M("e2", 1, "GAP stands for…", ["Grammar, Accuracy, Punctuation", "Genre, Audience, Purpose", "Goal, Argument, Point", "Guide, Answer, Plan"], 1, "Decide Genre, Audience and Purpose before writing.");
M("e2", 2, "Which feature is most typical of a report?", ["Rhetorical questions throughout", "Sub-headings and a factual tone", "Slang and jokes", "A rhyming conclusion"], 1, "Reports are organised with sub-headings and use a formal, factual tone.");
M("e2", 2, "Acknowledging an opposing view and then disproving it is called…", ["an anecdote", "a counter-argument", "a hyperbole", "a triple"], 1, "A counter-argument strengthens persuasive writing.");
W("e2", 3, "exam", 6, "Write the opening paragraph (80–100 words) of a speech to your school assembly persuading students to volunteer for a local clean-up.", "Award up to 3 for content: greets the audience, clear purpose, at least two persuasive devices (e.g. rhetorical question, direct address, statistic, triple).\nUp to 3 for style and accuracy: appropriate register, varied sentences, accurate spelling and punctuation.");
M("e3", 1, "A formal letter starting 'Dear Sir/Madam' should end with…", ["Yours sincerely", "Yours faithfully", "Love", "Best wishes"], 1, "Unknown name → Yours faithfully.");
M("e3", 1, "Which is NOT suitable in a formal letter?", ["A subject line", "Contractions like 'can't'", "The date", "The receiver's designation"], 1, "Avoid contractions in formal writing.");
M("e3", 2, "The first paragraph of a formal complaint letter should…", ["describe your hobbies", "state the purpose of the letter", "thank the reader for their time", "list every detail of the problem"], 1, "State the purpose clearly and early.");
W("e3", 3, "exam", 5, "Write the subject line and first paragraph of a formal letter to your principal requesting more sports equipment.", "Subject line clear and specific [1]; correct salutation [1]; states purpose in the opening sentence [1]; formal polite tone, no contractions [1]; accurate language [1].");
M("e4", 1, "Which opening suits an informal letter?", ["To whom it may concern,", "Dear Sir,", "Dear Riya,", "Respected Madam,"], 2, "Informal letters use the person's first name.");
M("e4", 1, "Which closing suits an informal letter to a friend?", ["Yours faithfully,", "Best wishes,", "Yours obediently,", "Regards, the Management"], 1, "Friendly closings: Love, Best wishes, Your friend.");
W("e4", 2, "struct", 4, "Write three sentences to open an informal letter to a cousin you have not seen for a year.", "Friendly greeting with name [1]; asks after the reader [1]; shares personal news or recalls a memory [1]; warm, conversational tone [1].");

/* ---------- SCIENCE ---------- */
M("s1", 1, "The number of outer-shell electrons in an element is given by its…", ["period", "group", "mass number", "atomic radius"], 1, "For groups I–VII the group number equals the outer electrons.");
M("s1", 1, "What is the valency of oxygen (group VI)?", ["6", "2", "1", "4"], 1, "Oxygen needs 2 more electrons: 8 − 6 = 2.");
S("s1", 2, "Give the electron arrangement of sodium (atomic number 11), e.g. 2,8,1 style.", ["2,8,1", "2.8.1", "2 8 1"], "2 in the first shell, 8 in the second, 1 in the third.");
M("s1", 2, "Across a period from left to right, atoms generally…", ["get larger", "get smaller", "gain shells", "become more metallic"], 1, "More protons pull the electrons in more strongly, so atoms get smaller.");
W("s1", 3, "struct", 3, "Sulfur has atomic number 16. State (a) its electron arrangement [1], (b) its period [1], (c) its valency [1].", "(a) 2,8,6 [1] (b) period 3 [1] (c) 2 [1]");
M("s2", 1, "Which Group I metal is the most reactive?", ["Lithium", "Sodium", "Potassium", "They are equally reactive"], 2, "Reactivity increases down Group I.");
M("s2", 2, "What are the products when sodium reacts with water?", ["Sodium oxide and oxygen", "Sodium hydroxide and hydrogen", "Sodium chloride and water", "Sodium carbonate and hydrogen"], 1, "2Na + 2H₂O → 2NaOH + H₂.");
M("s2", 2, "Bromine at room temperature is a…", ["pale yellow gas", "red-brown liquid", "grey-black solid", "colourless gas"], 1, "Bromine is a red-brown liquid.");
M("s2", 2, "Which reaction will happen?", ["Iodine + sodium chloride", "Bromine + potassium chloride", "Chlorine + potassium bromide", "Iodine + potassium bromide"], 2, "Chlorine is more reactive than bromine, so it displaces it.");
W("s2", 3, "exam", 3, "Explain why potassium is more reactive than sodium.", "Potassium has more electron shells [1]; its outer electron is further from the nucleus / more shielded [1]; so it is lost more easily [1].");
M("s3", 1, "A positive ion is called a…", ["anion", "cation", "molecule", "isotope"], 1, "Cations are positive ions formed when atoms lose electrons.");
M("s3", 1, "What ion does magnesium form?", ["Mg⁺", "Mg²⁺", "Mg²⁻", "Mg⁻"], 1, "Magnesium (group II) loses 2 electrons.");
S("s3", 2, "What is the charge on a chloride ion? (e.g. +1, −2)", ["-1", "−1", "1-", "−"], "Chlorine gains one electron → Cl⁻ (charge −1).");
M("s3", 2, "SO₄²⁻ is the formula of the … ion.", ["sulfide", "sulfate", "sulfite", "sulfur"], 1, "SO₄²⁻ is sulfate.");
M("s4", 1, "Ionic bonding occurs between…", ["two non-metals", "a metal and a non-metal", "two metals", "noble gases"], 1, "Electrons transfer from a metal to a non-metal.");
S("s4", 2, "Write the formula of calcium chloride.", ["CaCl2", "CaCl₂"], "Ca²⁺ needs two Cl⁻ ions: CaCl₂.");
M("s4", 2, "Why does solid sodium chloride not conduct electricity?", ["It has no electrons", "Ions cannot move in the solid", "It is a covalent compound", "It is a metal"], 1, "Ions are fixed in the lattice; they move only when molten or dissolved.");
W("s4", 3, "exam", 3, "Aluminium forms Al³⁺ and oxygen forms O²⁻. Work out the formula of aluminium oxide and explain how you did it.", "Charges must balance [1]; 2 × (+3) = +6 and 3 × (−2) = −6 [1]; Al₂O₃ [1].");
M("s5", 1, "A covalent bond is…", ["a transfer of electrons", "a shared pair of electrons", "attraction between ions", "a sea of electrons"], 1, "Non-metals share electron pairs.");
M("s5", 2, "Which molecule contains a double bond?", ["H₂", "CH₄", "CO₂", "HCl"], 2, "CO₂ has two C=O double bonds.");
M("s5", 2, "Simple molecular substances have low melting points because…", ["covalent bonds are weak", "forces between molecules are weak", "they contain ions", "they are metals"], 1, "Only weak intermolecular forces need to be overcome.");
M("s5", 3, "Which giant covalent substance conducts electricity?", ["Diamond", "Graphite", "Silicon dioxide", "Sand"], 1, "Graphite has delocalised electrons.");
S("s6", 1, "Name the green pigment that absorbs light for photosynthesis.", ["chlorophyll"], "Chlorophyll is found in chloroplasts.");
M("s6", 1, "Which is the correct word equation for photosynthesis?", ["glucose + oxygen → carbon dioxide + water", "carbon dioxide + water → glucose + oxygen", "carbon dioxide + oxygen → glucose + water", "water + oxygen → glucose + carbon dioxide"], 1, "CO₂ and water are reactants; glucose and oxygen are products.");
M("s6", 2, "In the starch test, iodine turns … if starch is present.", ["orange-brown", "blue-black", "red", "green"], 1, "Iodine changes from orange-brown to blue-black.");
W("s6", 3, "exam", 4, "Describe how to test a leaf for starch.", "Boil the leaf in water to kill cells [1]; place in hot ethanol (water bath) to remove chlorophyll [1]; rinse in water to soften [1]; add iodine—blue-black shows starch [1].");
M("s7", 1, "Which is NOT a limiting factor for photosynthesis?", ["Light intensity", "Carbon dioxide concentration", "Temperature", "Oxygen concentration"], 3, "Oxygen is a product, not a limiting factor.");
M("s7", 2, "Why does the rate fall sharply at very high temperatures?", ["Light is blocked", "Enzymes are denatured", "CO₂ runs out", "Chlorophyll turns red"], 1, "Enzymes lose their shape above their optimum temperature.");
W("s7", 3, "exam", 3, "In a pondweed experiment, the rate stops increasing as the lamp moves closer. Explain why.", "Light is no longer the limiting factor [1]; another factor, e.g. CO₂ concentration [1] or temperature, is now limiting [1].");
M("s8", 1, "Which leaf tissue contains the most chloroplasts?", ["Spongy mesophyll", "Palisade mesophyll", "Upper epidermis", "Xylem"], 1, "Palisade cells are packed with chloroplasts near the top.");
M("s8", 1, "Stomata are opened and closed by…", ["root hairs", "guard cells", "xylem", "the cuticle"], 1, "Guard cells change shape to open and close stomata.");
W("s8", 2, "struct", 3, "Give three ways a leaf is adapted for photosynthesis.", "Any three [1 each]: broad, large surface area; thin—short diffusion distance; palisade cells with many chloroplasts; air spaces in spongy layer; transparent epidermis; stomata for gas exchange; veins for transport.");
M("s9", 1, "Xylem transports…", ["sugars both ways", "water and minerals upwards", "oxygen to roots", "starch to leaves"], 1, "Xylem carries water and mineral ions from roots to leaves.");
M("s9", 2, "Which condition decreases the rate of transpiration?", ["Higher temperature", "Windy weather", "High humidity", "Bright light"], 2, "Humid air reduces the concentration gradient for water vapour.");
S("s9", 1, "Name the tissue that carries sugars around a plant.", ["phloem"], "Phloem carries dissolved sugars by translocation.");
W("s9", 3, "exam", 3, "Explain why transpiration increases on a hot, windy day.", "Heat increases evaporation / particle energy [1]; wind removes water vapour from around the leaf [1]; maintaining a steep concentration gradient so diffusion is faster [1].");
M("s10", 1, "Which mineral is needed to make chlorophyll?", ["Nitrate", "Phosphate", "Magnesium", "Potassium"], 2, "Magnesium is part of the chlorophyll molecule.");
M("s10", 2, "A plant with stunted growth and yellow older leaves is most likely short of…", ["nitrates", "magnesium", "phosphates", "potassium"], 0, "Nitrates are needed for proteins and growth.");
M("s10", 2, "Purple leaves and poor root growth suggest a lack of…", ["nitrates", "phosphates", "magnesium", "water"], 1, "Phosphate deficiency causes poor roots and purple leaves.");
M("s11", 1, "Which process removes carbon dioxide from the atmosphere?", ["Respiration", "Combustion", "Photosynthesis", "Decomposition"], 2, "Photosynthesis takes in CO₂.");
M("s11", 2, "Decomposers return carbon to the air by…", ["photosynthesis", "respiration", "fossilisation", "transpiration"], 1, "Bacteria and fungi respire as they feed on dead matter.");
W("s11", 3, "exam", 3, "Explain how deforestation increases carbon dioxide in the atmosphere.", "Fewer trees means less photosynthesis [1], so less CO₂ is removed [1]; trees are often burned or decay, releasing CO₂ [1].");
S("s12", 1, "What is the unit of force?", ["newton", "newtons", "n"], "Force is measured in newtons (N).");
S("s12", 2, "A bag has a mass of 3 kg. Using g = 10 N/kg, find its weight in N.", ["30", "30n"], "W = mg = 3 × 10 = 30 N.");
M("s12", 2, "Forces of 12 N to the right and 5 N to the left act on a box. The resultant is…", ["17 N right", "7 N left", "7 N right", "0 N"], 2, "12 − 5 = 7 N in the direction of the larger force.");
M("s12", 1, "Which is a non-contact force?", ["Friction", "Air resistance", "Gravity", "Tension"], 2, "Gravity acts at a distance.");
S("s13", 1, "A block has mass 81 g and volume 30 cm³. Find its density in g/cm³.", ["2.7"], "ρ = 81 ÷ 30 = 2.7 g/cm³.");
S("s13", 2, "A stone raises the water level from 40 ml to 55 ml. What is its volume in cm³?", ["15"], "55 − 40 = 15 ml = 15 cm³.");
M("s13", 2, "Which formula gives mass?", ["m = V ÷ ρ", "m = ρ × V", "m = ρ ÷ V", "m = ρ + V"], 1, "Rearranged from ρ = m ÷ V.");
W("s13", 3, "exam", 4, "Describe how to find the density of an irregular stone.", "Measure mass on a balance [1]; part-fill a measuring cylinder and record volume [1]; lower in the stone and record new volume; difference = volume of stone [1]; density = mass ÷ volume [1].");
M("s14", 1, "The law of conservation of energy states that energy…", ["is always lost", "cannot be created or destroyed", "is only stored as heat", "increases in machines"], 1, "Energy is only transferred between stores.");
S("s14", 2, "A lamp uses 100 J and gives out 20 J of light. What is its efficiency (%)?", ["20", "20%"], "20 ÷ 100 × 100 = 20%.");
M("s14", 2, "As a ball falls, its energy is transferred mainly from…", ["kinetic to gravitational", "gravitational to kinetic", "chemical to elastic", "thermal to kinetic"], 1, "Height decreases (GPE falls) and speed increases (KE rises).");
W("s14", 3, "exam", 3, "A motor has an input of 500 J and wastes 150 J as heat. (a) Find the useful output [1]. (b) Calculate its efficiency [2].", "(a) 350 J [1] (b) 350 ÷ 500 × 100 [1] = 70% [1]");
M("s15", 1, "An object will float in water if its density is…", ["greater than 1 g/cm³", "less than 1 g/cm³", "exactly 2 g/cm³", "any value"], 1, "Water's density is 1 g/cm³.");
M("s15", 2, "A block of mass 600 g and volume 800 cm³ is placed in water. It…", ["sinks", "floats", "dissolves", "stays at the bottom"], 1, "Density = 0.75 g/cm³ < 1, so it floats.");
W("s15", 3, "exam", 3, "Explain why a steel ship floats although steel is denser than water.", "The ship is hollow and contains air [1]; so its average density is less than water [1]; it displaces enough water for upthrust to balance its weight [1].");
M("s16", 1, "Conduction mainly happens in…", ["solids", "gases", "a vacuum", "liquids only"], 0, "Particles in solids are close together and pass on vibrations.");
M("s16", 2, "Metals are good conductors because they have…", ["no particles", "free electrons", "large gaps", "low density"], 1, "Free (delocalised) electrons transfer energy quickly.");
M("s16", 1, "Which is the best thermal insulator?", ["Copper", "Aluminium", "Trapped air", "Iron"], 2, "Air is a poor conductor, especially when trapped.");
M("s17", 1, "Convection cannot take place in…", ["water", "air", "solids", "liquids"], 2, "Particles in solids cannot flow.");
M("s17", 2, "Warm air rises because it is…", ["heavier", "less dense", "more dense", "made of lighter particles"], 1, "Heated air expands and becomes less dense.");
W("s17", 3, "exam", 3, "Explain why the heating element of a kettle is at the bottom.", "Water near the element is heated, expands and becomes less dense [1]; it rises and cooler, denser water sinks [1]; a convection current heats all the water [1].");
M("s18", 1, "How does energy from the Sun reach Earth?", ["Conduction", "Convection", "Radiation", "Evaporation"], 2, "Space is a vacuum; only radiation needs no medium.");
M("s18", 2, "Which surface is the best emitter of infrared radiation?", ["Shiny silver", "Dull black", "Shiny white", "Polished metal"], 1, "Dull black surfaces are the best absorbers and emitters.");
W("s18", 3, "exam", 3, "Explain how a vacuum flask keeps a drink hot.", "Vacuum prevents conduction and convection [1]; silvered surfaces reflect / reduce radiation [1]; stopper reduces evaporation and convection from the top [1].");

/* ---------- HUMANITIES ---------- */
M("h1", 1, "Gandhi returned to India from South Africa in…", ["1909", "1915", "1919", "1920"], 1, "He returned in January 1915.");
M("h1", 1, "'Satyagraha' means…", ["armed revolt", "truth-force / soul-force", "self-rule", "foreign goods"], 1, "Satyagraha is non-violent resistance based on truth.");
M("h1", 2, "Gandhi's 1917 satyagraha in Bihar supported…", ["mill workers", "indigo farmers", "salt makers", "tea workers"], 1, "Champaran (1917) supported indigo cultivators.");
M("h1", 2, "Swadeshi encouraged Indians to…", ["use goods made in India", "join the British army", "learn English", "travel abroad"], 0, "Swadeshi means 'of one's own country'.");
W("h1", 3, "exam", 4, "Explain two key principles of Gandhi and show how each was used in the national movement.", "For each principle (max 2 each): names and explains principle [1]; links to a real campaign [1]. E.g. Ahimsa—Non-Cooperation called off after Chauri Chaura; Swadeshi—boycott and burning of foreign cloth, khadi; Satyagraha—Champaran, Salt March.");
M("h2", 1, "The Jallianwala Bagh massacre took place in…", ["1915", "1919", "1922", "1930"], 1, "13 April 1919, Amritsar.");
M("h2", 2, "Why did Gandhi call off the Non-Cooperation Movement?", ["The British granted independence", "Violence at Chauri Chaura", "The Khilafat ended", "He was ill"], 1, "In February 1922, after violence at Chauri Chaura.");
M("h2", 2, "The Rowlatt Act allowed the government to…", ["tax salt", "detain people without trial", "ban khadi", "hold elections"], 1, "It permitted detention without trial.");
M("h2", 2, "Which was part of the Non-Cooperation programme?", ["Joining legislative councils", "Boycotting foreign cloth", "Fighting in World War II", "Signing the Cripps offer"], 1, "Foreign cloth was boycotted and burned.");
W("h2", 3, "exam", 6, "Explain the causes of the Non-Cooperation Movement. [6]", "Up to 2 marks per explained cause (max 6): Rowlatt Act—detention without trial angered Indians; Jallianwala Bagh—brutality destroyed faith in British justice; Khilafat issue—Gandhi united Hindus and Muslims; economic hardship after WWI. 1 mark for identifying, 1 for explaining.");
M("h3", 1, "Who led peasants in Awadh against talukdars?", ["Baba Ramchandra", "Bhagat Singh", "Subhas Chandra Bose", "Dadabhai Naoroji"], 0, "Baba Ramchandra led the Awadh Kisan Sabha.");
M("h3", 2, "Khan Abdul Ghaffar Khan led the…", ["Akali Movement", "Khudai Khidmatgars", "Swaraj Party", "Muslim League"], 1, "A non-violent movement in the North-West Frontier.");

eng: { title: "English Practice Paper", instructions: "Reading time comes first: read the passage carefully—answers are locked until writing time begins. Section A: answer all questions. Section B: answer ONE task.",
sections: [
{ name: "Section A · Reading (non-fiction)", passage: "Under the Shade: Why Every Street Needs Its Trees\n(Practice passage written for this paper)\n\n[1] Step outside on a May afternoon in almost any Indian city and you will feel it instantly: the heat rising off the road, the glare bouncing from glass and concrete. Now walk into the shade of an old neem or peepal tree. The difference is not your imagination. Researchers who measure street temperatures have found that shaded pavements can be several degrees cooler than exposed ones.\n\n[2] Trees do far more than cool us down. A single large tree can trap dust on its leaves, soak up rainwater that would otherwise flood our lanes, and provide a home for birds, squirrels and insects. Its roots hold soil together, and its leaves take in carbon dioxide while releasing oxygen. In short, a tree is a free air-conditioner, water filter and wildlife shelter rolled into one.\n\n[3] Yet every year, thousands of mature trees are cut down to widen roads or make space for new buildings. Saplings are planted to replace them, but a sapling is not a tree. It will take twenty years or more to provide the same shade, and many saplings die within their first summer because nobody waters them.\n\n[4] Some neighbourhoods are fighting back. In one Bengaluru colony, residents have formed a 'tree watch' group. They map every tree on their streets, water young plants during the dry months and alert the authorities when they see illegal felling. 'We used to think trees were somebody else's job,' says one volunteer, a retired teacher. 'Now we know they are everyone's job.'\n\n[5] Surely we can do the same. Adopting a sapling costs almost nothing; a bucket of water twice a week keeps it alive. Schools could plant and care for trees as class projects. City planners could design roads around old trees instead of through them.\n\n[6] The next time you stand in the cool shade of a tree, remember: someone, many years ago, planted it and cared for it. Isn't it our turn now?", qs: [
{ type: "mcq", m: 1, q: "What is the main purpose of the passage?", o: ["To entertain readers with a story", "To persuade readers to protect and care for trees", "To explain how to plant a tree", "To describe the weather in May"], a: 1 },
{ type: "mcq", m: 1, q: "In paragraph 2, the writer compares a tree to", o: ["a building and a road", "an air-conditioner, a water filter and a wildlife shelter", "a teacher and a volunteer", "a bucket of water"], a: 1 },
{ type: "mcq", m: 1, q: "According to paragraph 3, why do many saplings die?", o: ["They are cut down", "Nobody waters them", "Birds eat them", "They are planted in shade"], a: 1 },
{ type: "mcq", m: 1, q: "'A sapling is not a tree' suggests that", o: ["saplings are a different species", "young plants cannot immediately replace mature trees", "saplings grow faster than trees", "saplings should not be planted"], a: 1 },
{ type: "mcq", m: 1, q: "The final sentence of the passage is an example of", o: ["a statistic", "an anecdote", "a rhetorical question", "a simile"], a: 2 },
{ type: "written", m: 2, q: "Give two things the 'tree watch' group does (paragraph 4).", ms: "Any two [1 each]: maps every tree; waters young plants in dry months; alerts authorities about illegal felling." },
{ type: "written", m: 3, q: "In your own words, explain why planting saplings is not enough to replace mature trees.", ms: "Young plants take many years (20+) to give the same shade/benefits [1]; many do not survive their first summer [1]; because they are not looked after/watered [1]. Copied phrases without rewording: max 1." },
{ type: "written", m: 2, q: "Identify one fact and one opinion from the passage.", ms: "Fact, e.g. residents formed a tree watch group / trees take in carbon dioxide [1]. Opinion, e.g. 'Surely we can do the same' / trees are everyone's job [1]." },
{ type: "written", m: 6, q: "How does the writer use language in paragraphs 1 and 2 to persuade readers that trees are valuable? Refer to words and phrases in your answer.", ms: "Up to 2 marks per well-developed point (technique + evidence + effect), max 6. E.g. direct address 'you will feel it' involves the reader personally; sensory detail 'heat rising', 'glare bouncing' makes the heat vivid; contrast between road and 'cool shade' highlights the benefit; list of benefits (dust, rainwater, wildlife) builds an impression of value; metaphor/triple 'air-conditioner, water filter and wildlife shelter' makes benefits memorable; 'free' stresses there is no cost." },
{ type: "written", m: 7, q: "Summarise the benefits of trees AND what people can do to protect them, using information from the passage. Write 60–80 words in your own words.", ms: "Content (up to 5): cooling/shade; trap dust; absorb rainwater/reduce flooding; habitat for wildlife; hold soil; take in CO₂/release oxygen; adopt and water saplings; school planting projects; planners design around trees; neighbourhood watch groups. 1 mark per point, max 5.\nWriting (up to 2): own words, concise, within word limit, fluent." }
] },
{ name: "Section B · Writing (answer ONE task)", qs: [
{ type: "written", m: 25, q: "Choose ONE task. Write about 250–300 words.\n\n(a) Non-fiction writing: Write an article for your school magazine titled 'Our School, Our Trees', persuading students to take part in a tree-care project.\n\n(b) Formal letter: Write a letter to the Municipal Commissioner of your city asking for old trees on your road to be protected during road widening.\n\n(c) Informal letter: Write a letter to a friend in another city describing a tree-planting day you took part in and inviting them to start one in their area.", ms: "Content and structure (13): purpose and audience clear; correct form features (headline/subheadings for article; address, date, subject, salutation and 'Yours faithfully/sincerely' for formal; warm greeting and close for informal); well-developed ideas; logical paragraphs with linking.\nStyle and accuracy (12): register suited to form; varied vocabulary and sentence structures; persuasive/descriptive techniques used purposefully; accurate spelling, punctuation and grammar.\nBands: 22–25 excellent; 17–21 good; 12–16 competent; 6–11 basic; 0–5 limited." }

{ type: "written", m: 5, q: "(a) Describe how sodium and chlorine atoms form ions in sodium chloride. [3]\n(b) Explain why sodium chloride has a high melting point. [2]", ms: "(a) Sodium loses one electron [1]; chlorine gains one electron [1]; forming Na⁺ and Cl⁻ with full outer shells, attracted to each other [1].\n(b) Giant ionic lattice with strong electrostatic forces [1]; lots of energy needed to overcome them [1]." },
{ type: "written", m: 4, q: "(a) Describe the bonding in a water molecule. [2]\n(b) Explain why water has a much lower boiling point than sodium chloride. [2]", ms: "(a) Oxygen shares one pair of electrons with each of two hydrogen atoms [1]; two single covalent bonds [1].\n(b) Water is simple molecular with weak intermolecular forces [1]; NaCl has strong ionic bonds throughout a lattice [1]." },
{ type: "written", m: 6, q: "A student counted oxygen bubbles from pondweed with a lamp at different distances:\n10 cm → 48 bubbles/min; 20 cm → 30; 30 cm → 16; 40 cm → 9.\n(a) Describe the relationship shown. [1]\n(b) Explain this relationship. [2]\n(c) Give two variables the student should control. [2]\n(d) At 5 cm the count was still 48. Suggest why. [1]", ms: "(a) As distance increases, bubble rate decreases [1].\n(b) Further away = lower light intensity [1]; less light energy for photosynthesis so less oxygen produced [1].\n(c) Any two: temperature, CO₂ concentration, same pondweed / length, same time period [2].\n(d) Light is no longer the limiting factor—CO₂ or temperature is limiting [1]." },
{ type: "written", m: 5, q: "(a) Describe how water moves from the soil to the leaves of a plant. [3]\n(b) Give two conditions that increase the rate of transpiration. [2]", ms: "(a) Absorbed by root hair cells by osmosis [1]; travels up the xylem [1]; pulled up as water evaporates from leaves through stomata (transpiration stream) [1].\n(b) Any two: high temperature, high light intensity, wind, low humidity [2]." },
{ type: "written", m: 5, q: "(a) Explain why a cooking pan has a copper base and a plastic handle. [2]\n(b) Explain how a sea breeze forms during the day. [2]\n(c) Why are solar water panels painted black? [1]", ms: "(a) Copper is a good conductor, transferring heat to the food [1]; plastic is an insulator so the handle stays cool [1].\n(b) Land heats faster; air above it warms, becomes less dense and rises [1]; cooler, denser air from the sea moves in to replace it [1].\n(c) Black surfaces are good absorbers of radiation [1]." }
] }
] },

hum: { title: "Humanities Practice Paper", instructions: "Unit: Swaraj to Samvidhaan – The Birth of a Nation. Answer all questions. Use dates and named examples.",
sections: [
{ name: "Section A · Multiple choice", qs: [
{ type: "mcq", m: 1, q: "Gandhi returned to India from South Africa in", o: ["1909", "1915", "1917", "1920"], a: 1 },
{ type: "mcq", m: 1, q: "The incident at Chauri Chaura took place in", o: ["1919", "1920", "1922", "1930"], a: 2 },
{ type: "mcq", m: 1, q: "How many volunteers set out with Gandhi on the Salt March?", o: ["12", "45", "78", "240"], a: 2 },
{ type: "mcq", m: 1, q: "The Quit India resolution was passed in", o: ["Lahore", "Bombay", "Calcutta", "Nagpur"], a: 1 },
{ type: "mcq", m: 1, q: "Who was known as the 'Frontier Gandhi'?", o: ["Khan Abdul Ghaffar Khan", "Maulana Azad", "Shaukat Ali", "Vallabhbhai Patel"], a: 0 },
{ type: "mcq", m: 1, q: "Purna Swaraj was declared at the Congress session of", o: ["Lahore 1929", "Nagpur 1920", "Bombay 1942", "Calcutta 1920"], a: 0 }
] },
{ name: "Section B · Short answer", qs: [
{ type: "written", m: 2, q: "What is satyagraha? Give one example of its use.", ms: "Non-violent resistance based on truth / soul-force [1]; example: Champaran 1917 / Kheda / Salt March [1]." },
{ type: "written", m: 2, q: "State two parts of the Non-Cooperation programme.", ms: "Any two [1 each]: surrender titles; boycott schools/colleges; boycott courts; boycott councils; boycott foreign cloth; adopt khadi/swadeshi; national schools." },
{ type: "written", m: 2, q: "Who was Baba Ramchandra and what did he demand?", ms: "Leader of the Awadh peasants / Kisan Sabha [1]; demanded reduced rents / end to begar / social boycott of oppressive landlords [1]." },
{ type: "written", m: 2, q: "What did Gandhi do at Dandi on 6 April 1930, and why was it important?", ms: "Made salt from seawater, breaking the salt law [1]; launched the Civil Disobedience Movement / inspired mass law-breaking [1]." },
{ type: "written", m: 2, q: "Give two reasons why the Quit India Movement was launched in 1942.", ms: "Any two [1 each]: failure of the Cripps Mission; Second World War / Japanese threat; demand for immediate independence; frustration with British refusal to share power." }
] },
{ name: "Section C · Source-based question", passage: "Source A (practice source written for this paper)\nA newspaper report describing a salt satyagraha in 1930:\n\n\"Column after column of volunteers walked silently towards the salt pans. Police officers stood in their way with steel-tipped lathis. As each row stepped forward, it was struck down. Not one volunteer raised an arm to defend himself. Women in the crowd carried the injured to a makeshift hospital, while the next row came forward. By evening, hundreds lay wounded, yet the marchers had not given up their discipline.\"", qs: [
{ type: "written", m: 2, q: "What does Source A tell you about the methods used by the satyagrahis?", ms: "Non-violent—did not fight back [1]; disciplined, organised rows / willing to suffer / women helped the injured [1]." },
{ type: "written", m: 3, q: "How useful is Source A to a historian studying the Civil Disobedience Movement?", ms: "Useful—eyewitness detail from the time showing methods and police response [1]; Limitation—one event only / may be one-sided or emotive in tone [1]; developed judgement with own knowledge, e.g. matches events at Dharasana [1]." },
{ type: "written", m: 3, q: "Using your own knowledge, explain why the Salt March gained so much support.", ms: "Salt used by everyone so all were affected [1]; simple, non-violent law-breaking anyone could join [1]; publicity/world attention, Gandhi's leadership, spread to other regions (e.g. Vedaranyam) [1]." }
] },
{ name: "Section D · Extended response", qs: [
{ type: "written", m: 8, q: "'The Non-Cooperation Movement was more important than the Quit India Movement in India's struggle for freedom.' How far do you agree? Explain your answer.", ms: "Level 4 (7–8): balanced, well-supported argument with a clear, justified conclusion.\nLevel 3 (5–6): explains both movements with accurate detail; some judgement.\nLevel 2 (3–4): describes one or both movements with some detail.\nLevel 1 (1–2): basic, general points.\nNCM points: first mass movement; Hindu–Muslim unity; Congress became a mass party; boycott, khadi, national schools. Quit India points: demand for immediate freedom; mass participation despite arrests; parallel governments; showed British rule was unsustainable." }
] }
] },

{ name: "Section B · Listening Exercise 2 – MCQ", listen: true, listenPassage: "मेरा नाम अनन्या है। मैं दिल्ली में अपने परिवार के साथ रहती हूँ। मेरे परिवार में पाँच लोग हैं — मेरे माता-पिता, मेरा छोटा भाई, मेरी दादी और मैं। हर रविवार हम सब मिलकर नाश्ता करते हैं। पिछले रविवार हम चिड़ियाघर जाना चाहते थे, लेकिन बारिश के कारण हम घर पर ही रहे और हमने लूडो खेला। मेरी दादी लूडो में सबसे अच्छी हैं। मेरा शौक़ चित्र बनाना है, और मेरे भाई को फ़ुटबॉल खेलना पसंद है।", qs: [
{ type: "mcq", m: 1, q: "अनन्या कहाँ रहती है?", o: ["मुंबई", "दिल्ली", "जयपुर", "कोलकाता"], a: 1 },
{ type: "mcq", m: 1, q: "अनन्या के परिवार में कितने लोग हैं?", o: ["तीन", "चार", "पाँच", "छह"], a: 2 },
{ type: "mcq", m: 1, q: "पिछले रविवार परिवार ने क्या किया?", o: ["चिड़ियाघर गए", "पार्क गए", "घर पर रहकर लूडो खेला", "बाज़ार गए"], a: 2 },
{ type: "mcq", m: 1, q: "लूडो में सबसे अच्छी कौन है?", o: ["माँ", "अनन्या", "दादी", "बहन"], a: 2 },
{ type: "mcq", m: 1, q: "अनन्या का शौक़ क्या है?", o: ["फ़ुटबॉल खेलना", "चित्र बनाना", "गाना गाना", "किताबें पढ़ना"], a: 1 }
] },
{ name: "Section C · Unit 1 & 2 – Everyday Activity, Personal and Social Life", qs: [

{ type: "mcq", m: 1, q: "लड़कियाँ पार्क में ___ हैं।", o: ["खेल रहा", "खेल रही", "खेल रहे", "खेलता"], a: 1 },
{ type: "mcq", m: 1, q: "'सवा दस बजे' का अर्थ है", o: ["10:15", "10:30", "9:45", "10:45"], a: 0 },
{ type: "mcq", m: 1, q: "'दोस्त' का समानार्थी शब्द चुनिए।", o: ["शत्रु", "मित्र", "पड़ोसी", "अतिथि"], a: 1 },
{ type: "written", m: 4, q: "अपने परिवार के बारे में चार वाक्य लिखिए।", ms: "Four correct, relevant sentences [1 each]—family members, descriptions, activities. Correct verb agreement (है/हैं) and possessives (मेरा/मेरी/मेरे)." }
] },
{ name: "Section D · Creative Writing", qs: [
{ type: "written", m: 7, q: "डायरी लेखन: दिवाली के दिन आपने क्या-क्या किया? उस दिन की डायरी लिखिए। (60–80 शब्द)", ms: "Format [2]: दिनांक/दिन/समय, 'प्रिय डायरी', name.\nContent [3]: events of the day, feelings, reflection.\nLanguage [2]: past tense, agreement, varied vocabulary." },
{ type: "written", m: 8, q: "अनौपचारिक पत्र: अपनी दादी को पत्र लिखकर बताइए कि आपकी परीक्षाओं की तैयारी कैसी चल रही है। (80–100 शब्द)", ms: "Format [3]: पता, दिनांक, संबोधन (पूज्य/आदरणीय दादीजी), अभिवादन (सादर प्रणाम), समापन (आपका प्रिय पोता / आपकी प्रिय पोती), नाम.\nContent [3]: कुशल-क्षेम; preparation details; feelings/plans; asks about दादी.\nLanguage [2]: आप-forms, accurate grammar and spelling." }
] }
] },

gp: { title: "Global Perspectives Practice Paper", instructions: "Read the sources, then answer all questions. Refer to the sources where asked.",
sections: [
{ name: "Section A · Multiple choice", qs: [
{ type: "mcq", m: 1, q: "'Electric cars will replace petrol cars by 2040.' This is a", o: ["fact", "prediction", "value judgement", "statistic"], a: 1 },
{ type: "mcq", m: 1, q: "Information you collect yourself through a survey is", o: ["secondary", "primary", "biased", "qualitative only"], a: 1 },
{ type: "mcq", m: 1, q: "Something a person takes for granted without proof is", o: ["evidence", "an assumption", "a conclusion", "a fact"], a: 1 },
{ type: "mcq", m: 1, q: "Checking a claim using several independent sources is", o: ["corroboration", "speculation", "sampling", "prediction"], a: 0 },
{ type: "mcq", m: 1, q: "Which is the strongest criterion for the most important consequence?", o: ["It is the longest to explain", "It affects the most people for the longest time", "It was mentioned first", "It is the most interesting"], a: 1 }
] },
{ name: "Section B · Source-based skills", passage: "Source 1 (practice source written for this paper) — an article from a city news website:\n\"Plastic waste is choking our city. Last year, the municipal corporation collected about 600 tonnes of plastic waste every day. Single-use plastic should be banned immediately. Shopkeepers say paper bags are too expensive, but residents who switched to cloth bags report saving money within a month. Experts predict that if nothing changes, our landfills will be full within ten years.\"\n\nSource 2 — results of a student survey (50 students from one class):\nUse cloth bags always: 12 · Sometimes: 23 · Never: 15\nStudents who support a ban on single-use plastic: 38 of 50", qs: [
{ type: "written", m: 4, q: "From Source 1, identify one fact, one opinion, one prediction and one value judgement.", ms: "Fact: 600 tonnes collected daily [1]; Opinion: plastic is 'choking' our city / paper bags too expensive (shopkeepers' view) [1]; Prediction: landfills full within ten years [1]; Value judgement: single-use plastic should be banned [1]." },
{ type: "written", m: 6, q: "Compare the perspectives of shopkeepers and residents in Source 1. Identify each position, their reasoning, and why their backgrounds might shape their views.", ms: "Shopkeepers' position/reason: paper bags too expensive [1–2]; residents' position/reason: cloth bags save money [1–2]; explanation of how role/interests (business costs vs household savings) shape views [1]; comparative language [1]. Max 6." },
{ type: "written", m: 6, q: "Identify two consequences of plastic waste and explain which is the most important, using a clear criterion.", ms: "Two valid consequences, e.g. landfills filling, blocked drains/flooding, harm to animals, health effects [2]; clear judgement with criterion (scale/severity/duration) [2]; comparison explaining why the other is less important [2]." },
{ type: "written", m: 7, q: "Test the claim 'Plastic waste is choking our city' using the evidence in the sources. How could you check it further?", ms: "Uses data (600 tonnes/day) as support [1]; notes emotive language / no comparison with other cities [1]; source type—news website, purpose and possible bias [1]; no named experts cited [1]; suggestions to verify: municipal reports, independent environmental studies, compare across years [2]; overall judgement [1]." },
{ type: "written", m: 7, q: "Evaluate the student survey in Source 2. What conclusion can be drawn, how reliable is it, and how could the research be improved?", ms: "Conclusion supported by data: most students (38/50 = 76%) support a ban; only 24% always use cloth bags [2]; limitations: one class only, small/unrepresentative sample, self-reported answers [2]; improvements: larger random sample across classes/schools, add interviews/observation, repeat over time [2]; evaluative judgement [1]." }
] }
] },

dl: { title: "Digital Literacy Practice Paper", instructions: "Answer all questions. For number conversions, type digits only (letters for hexadecimal). For code output, type exactly what is printed.",
sections: [
{ name: "Section A · Multiple choice", qs: [

{ type: "mcq", m: 1, q: "In hexadecimal, the decimal value 13 is written as", o: ["B", "C", "D", "E"], a: 2 },
{ type: "mcq", m: 1, q: "How many bits are in one byte?", o: ["4", "8", "16", "2"], a: 1 },
{ type: "mcq", m: 1, q: "Web colour codes such as #00FF00 use", o: ["binary", "octal", "decimal", "hexadecimal"], a: 3 },

{ type: "mcq", m: 1, q: "What is printed by print(10 / 4)?", o: ["2", "2.5", "2.0", "3"], a: 1 }
] },
{ name: "Section B · Short answer", qs: [

{ type: "short", m: 2, q: "Convert 58 to binary.", a: ["111010"], ms: "32 + 16 + 8 + 2 → 111010" },
{ type: "short", m: 2, q: "Convert 3F₁₆ to decimal.", a: ["63"], ms: "3 × 16 + 15 = 63" },

] },
{ name: "Section C · Written and programming", qs: [
{ type: "written", m: 3, q: "Explain why programmers often use hexadecimal instead of binary, and give one real application of hexadecimal.", ms: "Shorter / easier for humans to read and write [1]; each hex digit = exactly 4 bits so conversion is easy and fewer errors [1]; application: colour codes / MAC addresses / memory addresses / error codes [1]." },
{ type: "written", m: 2, q: "What is the output? Explain why.\nx = 5\nif x > 3 and x % 2 == 0:\n    print('A')\nelif x > 3:\n    print('B')\nelse:\n    print('C')", ms: "Output B [1]; 5 % 2 is 1 so the first condition is False, but x > 3 is True [1]." },
{ type: "written", m: 4, q: "Write a Python program that asks the user for their age and prints 'Teen' if the age is from 13 to 19 inclusive, otherwise 'Not a teen'.", ms: "age = int(input(...)) [1]; condition age >= 13 and age <= 19 (or 13 <= age <= 19) [1]; correct if/else with colons and indentation [1]; correct outputs [1]." },
{ type: "written", m: 4, q: "Write a program using a for loop and range() to add all even numbers from 2 to 20 and print the total. What total should it print?", ms: "total = 0 before loop [1]; for n in range(2, 21, 2): [1]; total += n inside loop [1]; print(total) → 110 [1]." },
{ type: "written", m: 3, q: "Find and correct three errors:\nfor i in range(1, 5)\nprint(i * 2)\nPrint(\"Done\")", ms: "Missing colon after range(1, 5) [1]; print(i * 2) must be indented [1]; Print should be print (case-sensitive) [1]." }
] }
] }
};

var MOCKS_EXTRA = {};
(function () {
function M(q, o, a, m) { return { type: "mcq", m: m || 1, q: q, o: o, a: a }; }
function S(m, q, a, ms) { return { type: "short", m: m, q: q, a: a, ms: ms || a[0] }; }
function W(m, q, ms) { return { type: "written", m: m, q: q, ms: ms }; }
function ENGW(topic) { return W(25, "Choose ONE task. Write about 250–300 words.\n\n" + topic, "Content and structure (13): purpose and audience clear; correct form features (headline/subheadings for article; address, date, subject, salutation and 'Yours faithfully/sincerely' for formal; warm greeting and close for informal); well-developed ideas; logical paragraphs with linking.\nStyle and accuracy (12): register suited to form; varied vocabulary and sentence structures; techniques used purposefully; accurate spelling, punctuation and grammar.\nBands: 22–25 excellent; 17–21 good; 12–16 competent; 6–11 basic; 0–5 limited."); }

  return '<div style="margin-top:12px;padding-top:12px;border-top:2px dashed var(--line, rgba(0,0,0,.15))"><label class="row between" style="gap:12px"><span><b>Also sync my Groq API key</b><br><span class="tiny muted">' + (on ? "On: your key is saved in your private space in your Google account, so AI turns on by itself when you sign in on another device. Turn off to delete it from the cloud." : "Off: your key stays only on this device" + (g && g.key ? "" : " (no key added yet)") + ". Turn on to have AI switch on by itself on every device you sign in on. Only your Google account can read it.") + '</span></span><input type="checkbox" class="toggle" data-on="syncKeyToggle"' + (on ? " checked" : "") + ' aria-label="Also sync my Groq API key"></label></div>';
}
if (typeof ON !== "undefined") ON.syncKeyToggle = function (el) { syncSetKey(el.checked); };

/* ===== Print / PDF for mock papers ===== */
var DL = { ns: null, tried: false };
async function dlInit() {
  if (DL.tried) return DL.ns; DL.tried = true;
  try { if (window.claude && typeof window.claude.use === "function") DL.ns = await window.claude.use("downloads"); } catch (e) { DL.ns = null; }
  return DL.ns;
}
/* Save a file: through claude.ai's download permission when available, otherwise a normal browser download */
async function saveFile(filename, blob) {
  var ns = await dlInit();
  if (ns) {
    try { await ns.save({ filename: filename, data: blob }); return "saved"; }
    catch (e) { var c = e && e.code; if (c === "declined") return "declined"; if (c === "rate_limited") { toast("A save box is already open. Finish that one first.", "info"); return "busy"; } if (aiInFrame()) throw e; }
  }
  if (aiInFrame() && !ns) throw { code: "unavailable", message: "Saving files isn't available in this view." };
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  return "saved";
}

function pdfModal(sid, pi) {
  var P = paperOf(sid, pi), s = SUBJ[sid]; if (!P) { toast("No paper to print.", "bad"); return; }
  var canPrint = !aiInFrame();
  openModal('<div class="modal-h"><h2>Print or save as PDF</h2><button class="btn ghost icon-btn" data-act="closeModal" aria-label="Close">' + ic("x") + '</button></div><p class="muted">' + esc(P.title) + " · " + s.marks + " marks · " + s.duration + ' minutes</p><div class="stack" style="margin-top:12px"><label class="row"><input type="checkbox" class="check" id="pdf-key"><span>Add the answer key and mark scheme at the end <span class="tiny faint">(leave off if someone else is sitting the paper)</span></span></label><label class="row"><input type="checkbox" class="check" id="pdf-lines" checked><span>Include lined space for written answers</span></label>' + (P.sections.some(function (x) { return x.listen; }) ? '<p class="tiny muted">The listening items get a separate “reader\'s sheet” page so someone can read them aloud.</p>' : "") + '<p class="small" id="pdf-msg" role="status"></p></div><div class="modal-f">' + (canPrint ? '<button class="btn" id="pdf-print">' + ic("download") + "Print</button>" : "") + '<button class="btn primary" id="pdf-go">' + ic("download") + "Download PDF</button></div>");
  var opts = function () { return { key: $("#pdf-key").checked, lines: $("#pdf-lines").checked }; };
  $("#pdf-go").onclick = async function () {
    var btn = this, msg = $("#pdf-msg"); btn.disabled = true; msg.style.color = ""; msg.textContent = "Drawing the pages…";
    try {
      var blob = await paperPDF(sid, pi, opts(), function (t) { msg.textContent = t; });
      msg.textContent = "Saving…";
      var r = await saveFile(s.short.replace(/\s+/g, "-") + "-paper-" + (pi + 1) + (opts().key ? "-with-answers" : "") + ".pdf", blob);
      if (r === "saved") { closeModal(); toast("PDF ready. Open it and print. 🖨️", "good"); } else { msg.textContent = r === "declined" ? "Save was cancelled." : ""; btn.disabled = false; }
    } catch (e) { msg.style.color = "var(--bad)"; msg.textContent = (e && e.message) || "Couldn't make the PDF."; btn.disabled = false; }
  };
  if (canPrint) $("#pdf-print").onclick = function () { var o = opts(); closeModal(); printPaper(sid, pi, o); };
}

/* ---------- page layout ---------- */
var PG = { w: 794, h: 1123, pad: 52 };
function printCSS() {
  return ".pp-page{width:" + PG.w + "px;height:" + PG.h + "px;background:#fff;color:#1f1d24;padding:" + PG.pad + "px " + PG.pad + "px 40px;box-sizing:border-box;position:relative;overflow:hidden;font-family:'Patrick Hand','Kalam','Comic Sans MS',cursive;font-size:16px;line-height:1.45}" +
    ".pp-body{height:" + (PG.h - PG.pad - 40 - 26) + "px;overflow:hidden}" +
    ".pp-foot{position:absolute;left:" + PG.pad + "px;right:" + PG.pad + "px;bottom:18px;display:flex;justify-content:space-between;font-size:12px;color:#777;border-top:1px solid #ddd;padding-top:4px}" +
    ".pp-h1{font-family:'Schoolbell','Patrick Hand',cursive;font-size:28px;margin:0}.pp-meta{display:flex;flex-wrap:wrap;gap:18px;font-size:15px;margin:6px 0 10px}" +
    ".pp-fill{display:flex;gap:24px;margin:8px 0}.pp-fill span{flex:1;border-bottom:1.5px solid #333;padding-bottom:2px}" +
    ".pp-ins{border:1.5px dashed #888;border-radius:8px;padding:8px 12px;font-size:14.5px;margin:6px 0 14px}" +
    ".pp-sec{font-family:'Schoolbell','Patrick Hand',cursive;font-size:21px;border-bottom:2px solid #1f1d24;margin:14px 0 8px;padding-bottom:2px}" +
    ".pp-pass{border:1.5px solid #999;border-radius:6px;padding:8px 12px;font-size:15px;white-space:pre-wrap;background:#fbfaf5}" +
    ".pp-q{margin:10px 0 4px;white-space:pre-wrap}.pp-q b{font-family:'Schoolbell','Patrick Hand',cursive;font-weight:400;font-size:18px;margin-right:6px}.pp-m{float:right;color:#555;font-size:14px;margin-left:10px}" +
    ".pp-opts{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin:4px 0 4px 26px}.pp-opts.pics{grid-template-columns:repeat(4,1fr);font-size:30px}" +
    ".pp-line{height:30px;border-bottom:1px solid #9a9a9a;margin-left:26px}.pp-ans{margin:6px 0 4px 26px}.pp-ans span{display:inline-block;min-width:220px;border-bottom:1.5px solid #333}" +
    ".pp-key{font-size:14.5px;margin:6px 0;white-space:pre-wrap;border-left:3px solid #2f6fdb;padding-left:10px}.pp-key b{font-weight:400;font-family:'Schoolbell','Patrick Hand',cursive;font-size:16px}" +
    ".pp-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px}";
}
function ppBlocks(sid, pi, o) {
  var s = SUBJ[sid], P = paperOf(sid, pi), B = [], n = 0, hasListen = false, keyB = [], tr = [];
  var codeLike = function (t) { return sid === "dl" && /\n\s{2,}|\n(for|if|print|x =|num|total|marks)/.test(t); };
  B.push('<h1 class="pp-h1">' + esc(P.title) + '</h1><div class="pp-meta"><span><b>' + esc(s.name) + "</b></span><span>Total: " + s.marks + " marks</span><span>Time: " + s.duration + " minutes" + (s.reading ? " + reading time" : "") + "</span></div><div class=\"pp-fill\"><span>Name:</span><span>Date:</span><span>Marks:       / " + s.marks + '</span></div><div class="pp-ins">' + esc(P.instructions || "Answer all questions.") + "</div>");
  P.sections.forEach(function (sec, si) {
    var head = '<div class="pp-sec">' + esc(sec.name) + "</div>", B0 = B.length;
    if (sec.listen) { hasListen = true; B.push('<div class="pp-ins">🔊 Listening: someone reads each item aloud twice from the reader\'s sheet at the end.</div>'); if (sec.listenPassage) tr.push({ label: sec.name, text: sec.listenPassage }); }
    if (sec.passage) sec.passage.split(/\n\n+/).forEach(function (para) { B.push('<div class="pp-pass">' + esc(para) + "</div>"); });
    sec.qs.forEach(function (q) {
      n++;
      var qt = '<div class="pp-q"><span class="pp-m">[' + q.m + "]</span><b>" + n + ".</b><span" + (codeLike(q.q) ? ' class="pp-code"' : "") + ">" + esc(q.q) + "</span></div>";
      if (q.listen) tr.push({ label: "Question " + n, text: q.listen });
      if (q.type === "mcq") qt += '<div class="pp-opts' + (q.pic ? " pics" : "") + '">' + q.o.map(function (x, i) { return "<div>" + (q.pic ? "<span style=\"font-size:14px;font-family:'Patrick Hand',cursive\">" + "ABCD"[i] + "</span> " : "<b>" + "ABCD"[i] + ")</b> ") + esc(x) + "</div>"; }).join("") + "</div>";
      if (q.type === "short") qt += '<div class="pp-ans">Answer: <span>&nbsp;</span></div>';
      B.push(qt);
      if (q.type === "written" && o.lines) { var L = Math.min(40, Math.max(3, Math.round(q.m * 2.2))); for (var k = 0; k < L; k += 4) B.push(new Array(Math.min(4, L - k) + 1).join('<div class="pp-line"></div>')); }
      var ans = q.type === "mcq" ? "ABCD"[q.a] + ") " + q.o[q.a] : q.type === "short" ? q.a[0] + (q.ms && q.ms !== q.a[0] ? "  (" + q.ms + ")" : "") : q.ms;
      keyB.push('<div class="pp-key"><b>' + n + ".</b> [" + q.m + "] " + esc(ans) + "</div>");
    });
    if (B.length > B0) B[B0] = head + B[B0]; else B.push(head);
  });
  var out = [{ blocks: B, title: P.title }];
  if (hasListen) out.push({ blocks: ['<h1 class="pp-h1">Reader\'s sheet · listening</h1><div class="pp-ins">For the person reading aloud: read each item clearly twice, with a short pause between readings. Do not show this page to the student.</div>'].concat(tr.map(function (t) { return '<div class="pp-q"><b>' + esc(t.label) + "</b></div><div class=\"pp-pass\">" + esc(t.text) + "</div>"; })), title: "Reader's sheet" });
  if (o.key) out.push({ blocks: ['<h1 class="pp-h1">Answer key and mark scheme</h1><div class="pp-meta"><span>' + esc(P.title) + "</span></div>"].concat(keyB), title: "Answer key" });
  return out;
}
function ppPaginate(groups, host, label) {
  var pages = [];
  groups.forEach(function (g) {
    var page = null, body = null;
    var newPage = function () { page = document.createElement("div"); page.className = "pp-page"; body = document.createElement("div"); body.className = "pp-body"; page.appendChild(body); host.appendChild(page); pages.push({ el: page, title: g.title }); };
    newPage();
    g.blocks.forEach(function (html) {
      var d = document.createElement("div"); d.innerHTML = html; body.appendChild(d);
      if (body.scrollHeight > body.clientHeight + 1 && body.children.length > 1) { body.removeChild(d); newPage(); body.appendChild(d); }
    });
  });
  pages.forEach(function (p, i) { var f = document.createElement("div"); f.className = "pp-foot"; f.innerHTML = "<span>" + esc(label) + " · " + esc(p.title) + "</span><span>Page " + (i + 1) + " of " + pages.length + "</span>"; p.el.appendChild(f); });
  return pages.map(function (p) { return p.el; });
}
function ppHost(visible) {
  var old = $("#pp-host"); if (old) old.remove();
  var host = document.createElement("div"); host.id = "pp-host";
  host.style.cssText = visible ? "" : "position:fixed;left:-12000px;top:0;z-index:-1;";
  host.innerHTML = "<style>" + printCSS() + "</style>";
  document.body.appendChild(host); return host;
}
var PDFLIBS = { h2c: "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js", jspdf: "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" };
async function paperPDF(sid, pi, o, onStep) {
  try { if (!window.html2canvas) await loadScript(PDFLIBS.h2c); if (!(window.jspdf && window.jspdf.jsPDF)) await loadScript(PDFLIBS.jspdf); }
  catch (e) { throw { message: "The PDF maker needs an internet connection the first time. Connect and try again" + (aiInFrame() ? "." : ", or use Print.") }; }
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) { }
  var host = ppHost(false), s = SUBJ[sid];
  var pages = ppPaginate(ppBlocks(sid, pi, o), host, s.name + " · Paper " + (pi + 1));
  var doc = new window.jspdf.jsPDF({ unit: "pt", format: "a4", compress: true });
  for (var i = 0; i < pages.length; i++) {
    if (onStep) onStep("Drawing page " + (i + 1) + " of " + pages.length + "…");
    var c = await window.html2canvas(pages[i], { scale: 2, backgroundColor: "#ffffff", logging: false, useCORS: true });
    if (i) doc.addPage();
    doc.addImage(c.toDataURL("image/jpeg", 0.88), "JPEG", 0, 0, 595.28, 841.89);
  }
  host.remove();
  return doc.output("blob");
}
function printPaper(sid, pi, o) {
  var host = ppHost(true); host.className = "pp-print";
  ppPaginate(ppBlocks(sid, pi, o), host, SUBJ[sid].name + " · Paper " + (pi + 1));
  document.body.classList.add("printing");
  var done = function () { document.body.classList.remove("printing"); host.remove(); window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  setTimeout(function () { try { window.print(); } catch (e) { toast("Printing isn't available here. Use Download PDF.", "bad"); } setTimeout(function () { if (document.body.classList.contains("printing")) done(); }, 60000); }, 300);
}

try { boot(); } catch (e) { console.error(e); document.getElementById("view").innerHTML = "<div class=\"notice bad\">The app could not start: " + String(e.message).replace(/</g,"&lt;") + "</div>"; }

</script>
